[package]
edition.workspace = true
license.workspace = true
name = "lemurclaw-goal-extension"
version.workspace = true

[lib]
name = "lemurclaw_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
lemurclaw-analytics = { workspace = true }
lemurclaw-core = { workspace = true }
lemurclaw-extension-api = { workspace = true }
lemurclaw-otel = { workspace = true }
lemurclaw-protocol = { workspace = true }
lemurclaw-state = { workspace = true }
lemurclaw-tools = { workspace = true }
lemurclaw-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
lemurclaw-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
