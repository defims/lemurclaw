[package]
edition.workspace = true
license.workspace = true
name = "lemurclaw-skills-extension"
version.workspace = true

[lib]
name = "lemurclaw_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
lemurclaw-core-skills = { workspace = true }
lemurclaw-exec-server = { workspace = true }
lemurclaw-extension-api = { workspace = true }
lemurclaw-mcp = { workspace = true }
lemurclaw-otel = { workspace = true }
lemurclaw-protocol = { workspace = true }
lemurclaw-skills = { workspace = true }
lemurclaw-tools = { workspace = true }
lemurclaw-utils-path-uri = { workspace = true }
lemurclaw-utils-string = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
lemurclaw-models-manager = { workspace = true }
lemurclaw-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
