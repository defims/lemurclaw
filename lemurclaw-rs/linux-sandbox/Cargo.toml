[package]
name = "lemurclaw-linux-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lemurclaw_linux_sandbox"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
clap = { workspace = true, features = ["derive"] }
lemurclaw-install-context = { workspace = true }
lemurclaw-network-proxy = { workspace = true }
lemurclaw-process-hardening = { workspace = true }
lemurclaw-protocol = { workspace = true }
lemurclaw-sandboxing = { workspace = true }
lemurclaw-utils-absolute-path = { workspace = true }
globset = { workspace = true }
landlock = { workspace = true }
libc = { workspace = true }
seccompiler = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
lemurclaw-core = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
